name = "api"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[[containers]]
class_name = "api"
image = "./Dockerfile"
max_instances = 10

[[durable_objects.bindings]]
class_name = "MyContainer"
name = "MY_CONTAINER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyContainer"]